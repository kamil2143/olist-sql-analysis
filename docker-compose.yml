services:
  postgres:
    image: postgres:16-alpine
    container_name: olist_postgres
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: olist_dw
    ports:
      - "5432:5432"
    volumes:
      # Montujemy pliki CSV pod /data
      - ./data:/data:ro
      # Automatyczna inicjalizacja bazy przy pierwszym starcie (kolejność alfabetyczna!)
      - ./sql/00_setup.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
      - ./sql/01_check_load.sql:/docker-entrypoint-initdb.d/02_check_load.sql:ro
      - ./sql/20_views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      # Trwałe przechowywanie danych bazy między restartami kontenera
      - olist_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: olist_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  olist_pgdata: